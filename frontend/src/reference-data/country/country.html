<div class="rounded-2xl border border-gray-200 bg-white shadow-sm">
  <div class="flex items-center justify-between gap-4 px-5 pt-5">
    <div class="shrink-0">
      <h2 class="text-lg font-semibold text-gray-900">Countries</h2>
      <p class="text-sm text-gray-500">Countries, and related data.</p>
    </div>
    <div class="flex items-center gap-3">
      <input
        type="text"
        placeholder="Search countries..."
        class="w-48 px-3 py-2 text-sm border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
        [value]="countriesSearchTerm()"
        (input)="onCountriesSearch($event)"
      />
      <div class="flex items-center gap-2 shrink-0">
        <button
          type="button"
          class="text-sm font-semibold text-blue-600 hover:text-blue-500 disabled:text-gray-400 disabled:cursor-not-allowed"
          (click)="prevCountriesPage()"
          [disabled]="!canGoToPrevCountriesPage"
        >
          Previous
        </button>
        <span class="text-sm font-semibold text-gray-500">{{ countriesCurrentPage() }} / {{ totalCountriesPages }}</span>
        <button
          type="button"
          class="text-sm font-semibold text-blue-600 hover:text-blue-500 disabled:text-gray-400 disabled:cursor-not-allowed"
          (click)="nextCountriesPage()"
          [disabled]="!canGoToNextCountriesPage"
        >
          Next
        </button>
      </div>
    </div>
  </div>

  <div class="mt-4 divide-y divide-gray-100">
    @for (country of paginatedCountries; track $index) {
    <div class="px-5 py-3 flex items-start justify-between">
      <div>
        <div class="text-sm font-semibold text-gray-900">{{ country.name }}</div>
      </div>
      <span
        class="text-xs font-mono text-gray-500 bg-gray-50 border border-gray-200 rounded px-2 py-1"
        >{{ country.code }}</span
      >
    </div>
    }
  </div>
</div>
