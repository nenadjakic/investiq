<div class="px-6 py-8 lg:px-10 space-y-8">
  <div class="grid gap-4 sm:grid-cols-2 xl:grid-cols-4">
    @for (stat of stats(); track stat.label) {
    <div class="rounded-xl border border-gray-200 bg-white p-4 shadow-sm">
      <div class="text-sm font-medium text-gray-500">{{ stat.label }}</div>
      <div class="mt-2 text-3xl font-semibold text-gray-900">{{ stat.value }}</div>
    </div>
    }
  </div>

  <div class="grid gap-6 lg:grid-cols-2">
    <app-country (countriesCountChanged)="onCountriesCountChange($event)"></app-country>

    <app-currency (currenciesCountChanged)="onCurrenciesCountChange($event)"></app-currency>

	  <app-exchange (exchangesCountChanged)="onExchangesCountChange($event)"></app-exchange>

    <app-company (companiesCountChanged)="onCompaniesCountChange($event)"></app-company>

	  <app-sector (sectorsCountChanged)="onSectorsCountChange($event)"></app-sector>

	  <app-industry (industriesCountChanged)="onIndustriesCountChange($event)"></app-industry>
  </div>
</div>
