<div class="rounded-2xl border border-gray-200 bg-white shadow-sm">
  <div class="flex items-center justify-between gap-4 px-5 pt-5">
    <div class="shrink-0">
      <h2 class="text-lg font-semibold text-gray-900">Industries</h2>
      <p class="text-sm text-gray-500">Sector taxonomy.</p>
    </div>
    <div class="flex items-center gap-3">
      <input
        type="text"
        placeholder="Search industries..."
        class="w-48 px-3 py-2 text-sm border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
        [value]="industriesSearchTerm()"
        (input)="onIndustriesSearch($event)"
      />
      <button
        type="button"
        class="px-3 py-2 text-sm font-semibold text-white bg-blue-600 hover:bg-blue-500 rounded-lg"
        (click)="openIndustryModal()"
      >
        New
      </button>
      <div class="flex items-center gap-2 shrink-0">
        <button
          type="button"
          class="text-sm font-semibold text-blue-600 hover:text-blue-500 disabled:text-gray-400 disabled:cursor-not-allowed cursor-pointer"
          (click)="prevIndustriesPage()"
          [disabled]="!canGoToPrevIndustriesPage"
        >
          Previous
        </button>
        <span class="text-sm font-semibold text-gray-500">{{ industriesCurrentPage() }} / {{ totalIndustriesPages }}</span>
        <button
          type="button"
          class="text-sm font-semibold text-blue-600 hover:text-blue-500 disabled:text-gray-400 disabled:cursor-not-allowed cursor-pointer cursor-pointer"
          (click)="nextIndustriesPage()"
          [disabled]="!canGoToNextIndustriesPage"
        >
          Next
        </button>
      </div>
    </div>
  </div>

  <div class="mt-4 divide-y divide-gray-100">
    @for (industry of paginatedIndustries; track $index) {
    <div class="px-5 py-3 flex items-start justify-between">
      <div>
        <div class="text-sm font-semibold text-gray-900">{{ industry.name }}</div>
        @if (industry.sector?.name) {
        <div class="text-xs text-gray-500">Sector: {{ industry.sector?.name }}</div>
        }
      </div>
    </div>
    }
  </div>
</div>


@if (showIndustryModal()) {
<div class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
  <div class="bg-white rounded-lg shadow-lg w-full max-w-md p-6">
    <h3 class="text-lg font-semibold text-gray-900 mb-4">Add New Industry</h3>
    
    <div class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Industry Name</label>
        <input
          type="text"
          placeholder="Enter industry name"
          class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
          [(ngModel)]="industryForm().name"
        />
      </div>
      
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Sector</label>
        <select
          class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
          [(ngModel)]="industryForm().sectorId"
        >
          <option value="">Select a sector...</option>
          @for (sector of sectors(); track sector.id) {
          <option [value]="sector.id">{{ sector.name }}</option>
          }
        </select>
      </div>
    </div>
    
    <div class="mt-6 flex gap-3 justify-end">
      <button
        type="button"
        class="px-4 py-2 text-sm font-medium text-gray-700 bg-gray-100 hover:bg-gray-200 rounded-lg"
        (click)="closeIndustryModal()"
        [disabled]="isAddingIndustry()"
      >
        Cancel
      </button>
      <button
        type="button"
        class="px-4 py-2 text-sm font-medium text-white bg-blue-600 hover:bg-blue-500 rounded-lg disabled:opacity-50 disabled:cursor-not-allowed"
        (click)="submitAddIndustry()"
        [disabled]="isAddingIndustry()"
      >
        {{ isAddingIndustry() ? 'Adding...' : 'Add Industry' }}
      </button>
    </div>
  </div>
</div>
}
